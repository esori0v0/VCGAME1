<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>점프 타이밍 게임</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-wrap">
    <section class="title-area">
      <h1>점프 타이밍 게임</h1>
      <p>장애물이 다가오면 스페이스바 또는 클릭으로 점프하세요!</p>
    </section>

    <section class="hud">
      <div>점수: <strong id="score">0</strong></div>
      <div>목표: <strong id="goalScore">15</strong></div>
      <div>단계: <strong id="stageText">1단계</strong></div>
      <div>최고점수: <strong id="bestScore">0</strong></div>
      <div>상태: <strong id="gameStatus">대기 중</strong></div>
    </section>

    <section id="game" class="game" aria-label="점프 타이밍 게임 화면">
      <div class="sky-text">SPACE / CLICK</div>
      <div id="player" class="player"></div>
      <div id="obstacle" class="obstacle"></div>
      <div class="ground"></div>

      <div id="startPanel" class="start-panel">
        <h2>게임 시작</h2>
        <p>장애물 5개를 넘어서 15점을 달성하면 승리합니다. 1단계 → 2단계 → 3단계로 갈수록 빨라집니다.</p>
        <button id="startButton" type="button">시작하기</button>
      </div>

      <div id="gameOverPanel" class="game-over-panel hidden">
        <h2>게임 오버</h2>
        <p>최종 점수: <strong id="finalScore">0</strong></p>

        <form id="loseRankForm" class="rank-form">
          <label for="loseNicknameInput">닉네임 남기기</label>
          <div class="rank-input-row">
            <input id="loseNicknameInput" type="text" maxlength="10" placeholder="닉네임 입력" autocomplete="off" />
            <button id="saveLoseRankButton" type="submit">등록</button>
          </div>
          <p id="loseRankMessage" class="rank-message"></p>
        </form>

        <button id="restartButton" type="button">다시 시작</button>
      </div>

      <div id="winPanel" class="win-panel hidden">
        <h2>승리!</h2>
        <p>목표 점수 <strong id="winScore">15</strong>점을 달성했습니다!</p>

        <form id="rankForm" class="rank-form">
          <label for="nicknameInput">닉네임 남기기</label>
          <div class="rank-input-row">
            <input id="nicknameInput" type="text" maxlength="10" placeholder="닉네임 입력" autocomplete="off" />
            <button id="saveRankButton" type="submit">등록</button>
          </div>
          <p id="rankMessage" class="rank-message"></p>
        </form>

        <button id="winRestartButton" type="button">다시 시작</button>
      </div>
    </section>

    <section class="ranking-board">
      <div class="ranking-title-row">
        <h2>랭킹 TOP 10</h2>
        <button id="clearRankButton" class="small-button" type="button">랭킹 초기화</button>
      </div>
      <ol id="rankingList" class="ranking-list">
        <li class="empty-rank">아직 등록된 기록이 없습니다.</li>
      </ol>
    </section>

    <section class="guide">
      <h2>조작법</h2>
      <p><strong>스페이스바</strong>, <strong>↑ 방향키</strong>, 또는 <strong>마우스 클릭</strong>으로 점프합니다.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
